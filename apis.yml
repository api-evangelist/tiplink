aid: tiplink
name: TipLink
description: 'TipLink is a Solana wallet-link platform that lets anyone create a shareable
  link or QR code holding crypto or an NFT, so a recipient can claim digital assets without
  first setting up a wallet. It ships as first-party TypeScript/JavaScript SDKs (notably
  @tiplink/api) and Solana Wallet Adapter UI components rather than a hosted REST API,
  and is used for airdrops, tipping, payments, and onboarding new users to Solana.
  Backed by Multicoin Capital.'
